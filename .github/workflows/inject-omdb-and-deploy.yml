# Inject OMDb API key from GitHub Secrets into homepage.js before deploy.
# Add secret: repo Settings → Secrets and variables → Actions → New repository secret → OMDB_API_KEY.
name: Inject OMDb key and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  inject-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject OMDb API key
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -n "$OMDB_API_KEY" ]; then
            node analytics-lab/scripts/inject-omdb-key.js
          fi

