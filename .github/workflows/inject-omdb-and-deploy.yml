# Deploy analytics-lab (e.g. to GitHub Pages). OMDb key is no longer injected;
# use the backend proxy (api/omdb.js) with OMDB_API_KEY in server env (Vercel/Netlify). See README.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages

      # For OMDb posters: deploy the API separately (e.g. Vercel with Root = analytics-lab)
      # and set OMDB_API_KEY in Vercel Environment Variables. No key in the repo or client.
