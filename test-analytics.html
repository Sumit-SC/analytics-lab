<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Connection Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #0056b3; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Analytics Connection Diagnostic Tool</h1>
    
    <div class="test-section">
        <h2>Test 1: Worker Health Check</h2>
        <button onclick="testHealth()">Test Worker Health</button>
        <div id="health-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Endpoint Connectivity</h2>
        <p>Testing endpoints in order:</p>
        <button onclick="testEndpoints()">Test All Endpoints</button>
        <div id="endpoint-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Send Test Analytics Event</h2>
        <button onclick="sendTestEvent()">Send Test Event</button>
        <div id="event-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Check Dashboard</h2>
        <p>After sending test events, check if they appear in the dashboard:</p>
        <a href="https://stats.colab.indevs.in/recent?site=portfolio" target="_blank">
            <button>Open Dashboard (Portfolio)</button>
        </a>
        <a href="https://stats.colab.indevs.in/recent?site=analytics-lab" target="_blank">
            <button>Open Dashboard (Playground)</button>
        </a>
    </div>

    <script>
        const baseUrl = 'https://stats.colab.indevs.in';
        const endpoints = [
            '/api/events',
            '/api/track',
            '/events',
            '/track',
            '/ping',
            '/log',
            '/signals',
            '/collect'
        ];

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = '<p class="info">Testing...</p>';
            
            try {
                const response = await fetch(baseUrl + '/');
                const text = await response.text();
                if (response.ok && text === 'OK') {
                    resultDiv.innerHTML = '<p class="success">✓ Worker is reachable and healthy!</p>';
                } else {
                    resultDiv.innerHTML = `<p class="error">✗ Unexpected response: ${response.status} - ${text}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">✗ Failed to connect: ${error.message}</p>`;
                if (error.message.includes('blocked') || error.message.includes('Failed to fetch')) {
                    resultDiv.innerHTML += '<p class="error">This looks like an ad-blocker blocking the domain!</p>';
                }
            }
        }

        async function testEndpoints() {
            const resultDiv = document.getElementById('endpoint-result');
            resultDiv.innerHTML = '<p class="info">Testing endpoints...</p>';
            
            const testPayload = JSON.stringify({
                site: 'test',
                event: 'connection_test',
                ts: new Date().toISOString(),
                path: '/test'
            });

            let results = [];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(baseUrl + endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: testPayload
                    });
                    
                    if (response.ok) {
                        results.push(`<p class="success">✓ ${endpoint} - OK (${response.status})</p>`);
                        break; // Stop at first success
                    } else {
                        results.push(`<p class="error">✗ ${endpoint} - ${response.status}</p>`);
                    }
                } catch (error) {
                    if (error.message.includes('blocked') || error.message.includes('Failed to fetch')) {
                        results.push(`<p class="error">✗ ${endpoint} - BLOCKED BY CLIENT (ad-blocker)</p>`);
                    } else {
                        results.push(`<p class="error">✗ ${endpoint} - ${error.message}</p>`);
                    }
                }
            }
            
            resultDiv.innerHTML = results.join('');
        }

        async function sendTestEvent() {
            const resultDiv = document.getElementById('event-result');
            resultDiv.innerHTML = '<p class="info">Sending test event...</p>';
            
            const payload = {
                site: 'portfolio',
                event: 'test_event',
                ts: new Date().toISOString(),
                path: window.location.pathname,
                sessionId: 'test-' + Date.now()
            };

            // Try sendBeacon first
            let beaconWorked = false;
            if (navigator.sendBeacon) {
                try {
                    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                    if (navigator.sendBeacon(baseUrl + '/api/events', blob)) {
                        beaconWorked = true;
                        resultDiv.innerHTML = '<p class="success">✓ Event sent via sendBeacon</p>';
                        setTimeout(() => {
                            resultDiv.innerHTML += '<p class="info">Check the dashboard to see if the event appears (may take a few seconds)</p>';
                        }, 1000);
                        return;
                    }
                } catch (e) {
                    console.log('sendBeacon failed, trying fetch');
                }
            }

            // Try fetch
            try {
                const response = await fetch(baseUrl + '/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    keepalive: true,
                    credentials: 'omit'
                });
                
                if (response.ok) {
                    resultDiv.innerHTML = '<p class="success">✓ Event sent successfully via fetch (Status: ' + response.status + ')</p>';
                    resultDiv.innerHTML += '<p class="info">Check the dashboard to see if the event appears</p>';
                } else {
                    resultDiv.innerHTML = `<p class="error">✗ Failed: ${response.status} ${response.statusText}</p>`;
                }
            } catch (error) {
                if (error.message.includes('blocked') || error.message.includes('Failed to fetch')) {
                    resultDiv.innerHTML = '<p class="error">✗ BLOCKED BY CLIENT - Ad-blocker is preventing the request</p>';
                    resultDiv.innerHTML += '<p class="info">Try disabling ad-blockers or using a different subdomain</p>';
                } else {
                    resultDiv.innerHTML = `<p class="error">✗ Error: ${error.message}</p>`;
                }
            }
        }
    </script>
</body>
</html>
